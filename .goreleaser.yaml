# GoReleaser config for the billkit CLI.
#
# This does NOT run here. Development lives in the billstack monorepo, but the
# release runs in the public mirror `billkit-eu/billkit-cli`, because that is
# where the tag, the module path and the downloadable release all live. The
# mirror's own `.github/workflows/publish.yml` (installed by the split, from
# sdk/scripts/split-templates/cli/) is what invokes this file on a `v*` tag.
#
# Before a tag, validate with `mise run //cli:release-check`, which is
# `goreleaser check` plus `goreleaser release --snapshot --clean
# --skip=sign,sbom,notarize`. `--skip=sign` is needed because the `signs:` block
# below is keyless and needs a GitHub OIDC token, which a laptop does not have;
# `sbom` needs syft; `notarize` needs the five Apple credentials. Be aware that a
# snapshot does NOT exercise the publish pipe, so it cannot catch a bad
# `homebrew_casks.repository.token`; see the note on that field.
#
# The macOS signing and notarization credentials are documented on the
# `notarize:` block below, and mirrored in cli/README.md under "Signing and
# notarization". Nothing secret lives in this file; it reads five environment
# variables, and a real release fails without them (see `notarize:`).
version: 2

project_name: billkit

# There is deliberately no `before: hooks: [go mod tidy]` any more. A hook that
# rewrites go.mod/go.sum on the release runner builds the binary from a module
# graph no commit contains. Tidiness is checked instead, before a tag can
# exist: `go mod tidy -diff` in the mirror's CI and in `mise run //cli:check`.

builds:
  - id: billkit
    # The main package lives at cmd/billkit so that `go install` names the
    # binary `billkit` too. `binary:` below only ever renamed the GoReleaser
    # artifact, which left the from-source install path with a different name.
    main: ./cmd/billkit
    binary: billkit
    env:
      - CGO_ENABLED=0
    # Reproducible: -trimpath drops the runner's filesystem paths from the
    # binary, and every file's mtime is the commit's own timestamp, so the
    # same tag builds the same bytes wherever it is built.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Commit and Date feed `billkit version`. CommitDate rather than Date, so
    # the build time is the commit's and a rebuild does not change it.
    ldflags:
      - -s -w
      - -X github.com/billkit-eu/billkit-cli/internal/cli.Version={{ .Version }}
      - -X github.com/billkit-eu/billkit-cli/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/billkit-eu/billkit-cli/internal/cli.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# Developer ID signing + Apple notarization for the two darwin binaries.
#
# Why this exists: the CLI holds `bk_live_` keys on customers' laptops. An
# unsigned binary makes macOS tell the user the developer cannot be verified and
# invites them to click past a security warning, which is the last habit this
# tool should be teaching. Signing plus notarization fixes every download path
# at once: Homebrew, `install.sh`, and a browser download of the `.tar.gz`.
#
# Mechanism: GoReleaser's cross-platform `notarize.macos`, which embeds
# anchore/quill. It is chosen over the `notarize.macos_native` block because
# native is GoReleaser Pro only AND needs codesign/xcrun, i.e. a macOS runner;
# the quill path runs on the `ubuntu-latest` runner publish.yml already uses.
# It signs Mach-O binaries directly, which is exactly what we ship: bare
# executables in a tar.gz, no .app bundle, no .dmg, no .pkg.
#
# Nothing is stapled, and nothing can be. Apple: "Although tickets are created
# for standalone binaries, it's not currently possible to staple tickets to
# them." `stapler` handles .app, .dmg and flat .pkg only. So Gatekeeper looks the
# ticket up with Apple on first run instead of reading it off disk, which costs a
# network round trip on exactly one path: a quarantined first run. `install.sh`
# is unaffected either way, because curl sets no quarantine attribute and tar
# does not propagate one. See sdk/RELEASING.md for the full breakdown.
#
# Credentials (all five, or none):
#   MACOS_SIGN_P12           base64 of the Developer ID Application .p12
#   MACOS_SIGN_PASSWORD      the password that .p12 was exported with
#   MACOS_NOTARY_ISSUER_ID   App Store Connect API issuer UUID
#   MACOS_NOTARY_KEY_ID      App Store Connect API key ID
#   MACOS_NOTARY_KEY         base64 of the App Store Connect .p8 private key
#
# Mandatory for a release. It used to skip itself when the credentials were
# absent, the same bargain the Homebrew cask makes, and that bargain turned out
# to be wrong here: a cask installed from an unsigned build is killed by
# Gatekeeper at first launch on every user's Mac while the release job stays
# green (HOMEBREW_CLI.md, "The one thing that will bite you"). So a real release
# now always signs, and fails outright when any of the five is missing;
# publish.yml checks for them first so the failure names what is missing before
# anything is built. Only a snapshot (`--snapshot`, i.e. a laptop) still skips
# unless all five are set, so `mise run //cli:release-check` keeps working
# without Apple credentials.
#
# `index .Env "..."` and not `.Env.MACOS_SIGN_P12`, because the dotted form is a
# hard error when the name is absent from the environment entirely ("map has no
# entry for key"), and absent is the normal state on a laptop.
#
# For a snapshot the gate requires all five rather than any one of them, on
# purpose. A partial set would otherwise sign without notarizing, and a
# signed-but-unnotarized binary still trips Gatekeeper, so it would look fixed
# and not be.
notarize:
  macos:
    - ids:
        - billkit
      enabled: >-
        {{ if not .IsSnapshot }}true{{ else if and (index .Env "MACOS_SIGN_P12")
                  (index .Env "MACOS_SIGN_PASSWORD")
                  (index .Env "MACOS_NOTARY_ISSUER_ID")
                  (index .Env "MACOS_NOTARY_KEY_ID")
                  (index .Env "MACOS_NOTARY_KEY") }}true{{ else }}false{{ end }}
      sign:
        certificate: '{{ index .Env "MACOS_SIGN_P12" }}'
        password: '{{ index .Env "MACOS_SIGN_PASSWORD" }}'
      notarize:
        issuer_id: '{{ index .Env "MACOS_NOTARY_ISSUER_ID" }}'
        key_id: '{{ index .Env "MACOS_NOTARY_KEY_ID" }}'
        key: '{{ index .Env "MACOS_NOTARY_KEY" }}'
        # Wait, because the alternative is publishing a release whose binaries
        # Apple has not accepted yet. Two darwin binaries means two submissions,
        # so publish.yml passes `--timeout 60m` to keep GoReleaser's own 30m
        # default from cutting the second one short.
        wait: true
        timeout: 20m

archives:
  - id: billkit
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The licence and the changelog travel with the binary, so an archive
    # unpacked on its own still says what it is and what changed.
    #
    # Every entry carries the commit's timestamp and a fixed owner and mode,
    # like the binary (builds_info). Without them a tar or zip records each
    # file's checkout mtime and the runner's uid, so the archive, and with it
    # checksums.txt, changed on every rebuild of the same tag even though the
    # binary inside did not.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &fixed_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info: *fixed_file_info
      - src: README.md
        info: *fixed_file_info

checksum:
  name_template: checksums.txt

# A software bill of materials per archive, generated by syft (which
# publish.yml installs) and published beside it as
# `<archive>.sbom.json`. It lists the Go modules compiled into the binary, so
# a customer's scanner can answer "does the CLI ship the vulnerable version of
# X" without unpacking anything. The SBOM files are listed in checksums.txt
# like every other asset, which puts them under the cosign signature below.
#
# A laptop snapshot needs syft on PATH, or `--skip=sbom` beside
# `--skip=sign`.
sboms:
  - id: archives
    artifacts: archive

# Provenance for checksums.txt, and through it for every archive beside it.
#
# `install.sh` already verifies integrity: it reads checksums.txt and refuses an
# archive that does not match. That catches a truncated download, a corrupted
# mirror and a mangling proxy, and it catches nothing else: checksums.txt comes
# down the same channel as the archive, so anyone able to rewrite one can
# rewrite both. This block closes that gap: a signature over checksums.txt that
# only this repository's release workflow could have produced, which is what
# turns "these bytes are intact" into "these bytes are ours".
#
# Keyless, via Sigstore. There is no private key to store, rotate or leak: the
# job's GitHub OIDC token is exchanged for a certificate valid for minutes
# (hence `id-token: write` in publish.yml), the signature is recorded in the
# public Rekor transparency log, and a verifier checks the certificate's
# *identity* (repo, workflow file and tag) rather than a public key we would
# otherwise have to publish and defend. Signing the checksum file rather than
# each archive is deliberate and standard: the checksums already cover the
# archives, so one signature covers the release.
#
# Unlike the Homebrew tap token and the macOS signing credentials, this does NOT
# skip itself when something is missing, and the difference is not an
# inconsistency. Those two depend on secrets a human has to set in repository
# settings, where "forgotten" is a normal state and failing a release over it
# helps nobody. This depends only on a permission declared in the workflow file
# next to it, so "it did not run" can only mean that file is wrong, and the
# artifact of that mistake is a release whose provenance install.sh silently
# cannot check. That one should fail loudly and be fixed.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    # Surface cosign's own output in the job log; a signing step that says
    # nothing is one nobody notices has stopped working.
    output: true
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      # cosign prompts for confirmation before writing to the public
      # transparency log, and there is nobody here to answer it.
      - "--yes"

# A cask rather than a formula. Homebrew asks that pre-built binaries ship as
# casks, and GoReleaser has deprecated `brews` accordingly: with `brews` here,
# `goreleaser check` exits non-zero on the deprecation alone, which is a poor
# thing to have to ignore before every release.
#
# The cost is that casks are macOS-only, so `brew install` is a macOS path now.
# Linux keeps `install.sh` and the release archives, which is what the docs say.
homebrew_casks:
  - name: billkit
    binaries:
      - billkit
    # The cask push is conditional on the token, deliberately. It happens *after*
    # the GitHub release has been created and uploaded, so a push that cannot
    # authenticate fails the job over a release that actually shipped, and the
    # failure reads as though the release failed. So the step is skipped unless
    # `HOMEBREW_TAP_TOKEN` is set, and publish.yml prints a notice when it is not.
    #
    # `skip_upload` uses `index .Env "..."` rather than `.Env.HOMEBREW_TAP_TOKEN`,
    # because the dotted form is a hard error when the name is absent from the
    # environment entirely ("map has no entry for key"), and absent is the normal
    # state on a laptop. `index` returns an empty string instead, which is the
    # condition we want to test.
    #
    # `token` below is the exception and MUST be the dotted form. GoReleaser does
    # not template it like any other field: it runs `ApplySingleEnvOnly`, which
    # matches `^{{\s*\.Env\.[^.\s}]+\s*}}$` and rejects everything else with
    # "expected {{ .Env.VAR_NAME }} only (no plain-text or other interpolation)".
    # The `index` form failed v0.2.3 there, after the GitHub release had already
    # published. It is safe on a laptop regardless, because `doPublish` returns on
    # `skip_upload` before it ever resolves the token
    # (internal/pipe/cask/cask.go: the skip check is ~35 lines above the
    # `client.NewIfToken` call). Snapshot runs never reach the publish pipe at
    # all, which is why `goreleaser release --snapshot` could not catch this.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: billkit-eu
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://billkit.eu
    description: The BillKit command-line interface
    license: Apache-2.0
    # There is deliberately no `hooks.post.install` here any more. It used to run
    # `xattr -dr com.apple.quarantine` on the staged binary, because unsigned
    # binaries are refused by Gatekeeper and stripping the quarantine flag is
    # what every unsigned cask does. The `notarize:` block above removes the
    # reason for it: a notarized binary is accepted with the flag still on. The
    # workaround also only ever covered Homebrew, so anyone taking the `.tar.gz`
    # from the releases page kept getting the warning. Do not put it back to
    # paper over a signing failure; fix the signing instead.

changelog:
  use: github

release:
  github:
    owner: billkit-eu
    name: billkit-cli
  # Make a re-run idempotent. GoReleaser reuses an existing release for the tag
  # (createOrUpdateRelease), but by default a second upload of an asset that is
  # already there is a hard 422 `already_exists`, so re-running a job that failed
  # *after* the upload step (which is exactly where the Homebrew cask push sits)
  # cannot get past the uploads to reach the step that failed. That happened on
  # v0.2.4 and had to be unpicked by deleting the seven assets by hand.
  replace_existing_artifacts: true
